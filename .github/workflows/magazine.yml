name: Magazine page

on:
  push:
    paths:
      - "magazine/**"
      - "scripts/magazine/**"
      - "lib/**"
      - "tests/**"
      - ".github/workflows/magazine.yml"
  pull_request:
    paths:
      - "magazine/**"
      - "scripts/magazine/**"
      - "lib/**"
      - "tests/**"

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate pages from content.json
        run: node scripts/magazine/build.mjs
      - name: Commit regenerated pages (after edits made on github.com)
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain magazine sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add magazine sitemap.xml
            git commit -m "Rebuild magazine pages from content.json"
            git push
          fi
      - name: Run tests
        run: node --test tests/*.test.js
