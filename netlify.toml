# Added for the magazine landing page. This file intentionally does NOT set a
# build command or publish directory, so whatever is configured in the Netlify
# UI for the live site keeps working unchanged.

[functions]
  directory = "netlify/functions"
  included_files = ["magazine/content.json"]

# Send the form's /api/magazine-inquiry requests to the Netlify Function.
[[redirects]]
  from = "/api/magazine-inquiry"
  to = "/.netlify/functions/magazine-inquiry"
  status = 200
  force = true

[[headers]]
  for = "/magazine/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/magazine/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
